<style>

html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90vw}
.audit{font-size:13px;border-left:3px solid var(--line);padding:2px 0 8px 10px;margin-bottom:6px}

.scroll-x{overflow-x:auto}
.login{max-width:420px;margin:40px auto}
.inline{display:flex;gap:6px}

<script>
"use strict";
/* ================= HẰNG SỐ & TRƯỜNG DỮ LIỆU ================= */
const STATUSES=["Chưa cập nhật","Chưa xuất kho","Đang vận chuyển","Đã đến CH","Đang lắp","Hoàn thành","Đã nghiệm thu"];
const DONE=new Set(["Hoàn thành","Đã nghiệm thu"]);
const ROLES={admin:"Admin",doi_truong:"Đội trưởng KTKV",nha_thau:"Nhà thầu",viewer:"Người xem",pending:"Chờ duyệt"};
// [key, tên cột Excel, kiểu, nhóm]
const F=[
 ["stt","Stt","num","ch"],["phu_trach","Phụ trách khu vực","text","ch"],["tinh","Tỉnh","text","ch"],
 ["thang_kt","Tháng khai trương","month","ch"],["site","Site","text","ch"],["ten_ch","Tên cửa hàng","text","ch"],
 ["tinh_cu","Tỉnh/TP cũ (trước 1/7)","text","ch"],["huyen_cu","Quận/huyện cũ (trước 1/7)","text","ch"],
 ["cht","CHT","text","ch"],["sdt_cht","SĐT CHT","tel","ch"],
 ["hien_trang","Hiện trạng cụm máy nén","text","tk"],["doi_truong","Đội trưởng KTKV","text","tk"],["ktkv","KTKV","text","tk"],
 ["nt_lap","Nhà thầu lắp đặt","text","tk"],["nt_vc","Nhà thầu vận chuyển","text","tk"],["km","Km đến CH","num","tk"],
 ["vc_dk","Ngày VC - DỰ KIẾN","date","td"],["vc_tt","Ngày VC - THỰC TẾ","date","td"],
 ["lap_dk","Ngày lắp - DỰ KIẾN","date","td"],["lap_tt","Ngày lắp - THỰC TẾ","date","td"],["trang_thai","Trạng thái","status","td"],
 ["ma_ts","Mã TS xuất kho","text","tb"],["ten_vt","Tên vật tư","text","tb"],["article","Article","text","tb"],
 ["ncc","Nhà cung cấp","text","tb"],["model","Model","text","tb"],["serial_goc","Serial (dữ liệu gốc)","text","tb"],
 ["serial_tt","Serial thực tế","text","tb"],["xuat_xu","Xuất xứ","text","tb"],["dvt","ĐVT","text","tb"],
 ["so_luong","Số lượng","num","tb"],["dg_ts","Đơn giá tài sản (-VAT)","money","tb"],["dg_vc","Đơn giá V/C (-VAT)","money","tb"],
 ["dg_lap","Đơn giá lắp đặt dự kiến","money","tb"],["tong","Tổng","calc","tb"],
 ["ghi_chu","Ghi chú","textarea","kh"],["link","Link ảnh / hồ sơ","url","kh"],["ngay_cn","Ngày cập nhật","date","kh"],
 ["kiem_tra","Kiểm tra dữ liệu","calc","kh"]
];
const FK=Object.fromEntries(F.map(f=>[f[0],f]));
const DATE_KEYS=["vc_dk","vc_tt","lap_dk","lap_tt"];
const NT_FIELDS=["vc_tt","lap_tt","serial_tt","trang_thai","anh","ghi_chu"];
const DT_FIELDS=NT_FIELDS.concat(["vc_dk","lap_dk","ktkv","nt_lap","nt_vc","km","cht","sdt_cht","hien_trang","link","ma_ts","_pending"]);
const TEMPLATE_SERIALS=new Set(["BG1UTQ00000"]);

/* ================= TIỆN ÍCH ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const todayISO=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const addDays=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);const x=new Date(y,m-1,d+n);return ymd(x.getFullYear(),x.getMonth()+1,x.getDate())};
const fd=iso=>{if(!iso)return "";const p=String(iso).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:esc(iso)};
const fm=iso=>{if(!iso)return "";const p=String(iso).split("-");return p.length>=2?`${p[1]}/${p[0]}`:esc(iso)};
const money=n=>(Number(n)||0).toLocaleString("vi-VN");
const norm=s=>String(s??"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
const fold=s=>norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const fdt=ts=>{const d=new Date(ts);return isNaN(d)?"":`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= TÍNH TOÁN ================= */
const total=r=>(Number(r.so_luong)||0)*((Number(r.dg_ts)||0)+(Number(r.dg_vc)||0)+(Number(r.dg_lap)||0));
const stIdx=s=>Math.max(0,STATUSES.indexOf(s||"Chưa cập nhật"));
const isDone=r=>DONE.has(r.trang_thai);
const isLate=r=>!!r.lap_dk&&r.lap_dk<todayISO()&&!isDone(r);
function flags(r){
  const f=[],t=todayISO(),i=stIdx(r.trang_thai);
  if(r._pending&&Object.keys(r._pending).length)f.push("Ngày chờ xác nhận (nghi đảo ngày/tháng)");
  if(!r.doi_truong)f.push("Thiếu đội trưởng");
  if(!r.nt_vc)f.push("Thiếu NT vận chuyển");
  if(!r.nt_lap)f.push("Thiếu NT lắp đặt");
  if(!r.sdt_cht)f.push("Thiếu SĐT CHT");
  if(!r.vc_dk||!r.lap_dk)f.push("Thiếu ngày dự kiến");
  if(r.vc_dk&&r.lap_dk&&r.lap_dk<r.vc_dk)f.push("Ngày lắp DK trước ngày VC DK");
  if(r.vc_tt&&r.lap_tt&&r.lap_tt<r.vc_tt)f.push("Ngày lắp TT trước ngày VC TT");
  if((r.vc_tt&&r.vc_tt>t)||(r.lap_tt&&r.lap_tt>t))f.push("Ngày thực tế ở tương lai");
  if(i>=3&&!r.vc_tt)f.push("Đã đến CH nhưng thiếu ngày VC thực tế");
  if(i>=5&&!r.lap_tt)f.push("Hoàn thành nhưng thiếu ngày lắp thực tế");
  if(i>=5&&(!r.serial_tt||TEMPLATE_SERIALS.has(String(r.serial_tt).trim())))f.push("Hoàn thành nhưng thiếu serial thực tế");
  if(r.serial_tt&&S.stores.some(o=>o.site!==r.site&&o.serial_tt&&norm(o.serial_tt)===norm(r.serial_tt)))f.push("Serial thực tế bị trùng");
  return f;
}
function groupBy(rows,key){
  const m=new Map();
  for(const r of rows){const k=(r[key]||"(Chưa có)").toString().trim();if(!m.has(k))m.set(k,{k,n:0,done:0,late:0});const g=m.get(k);g.n++;if(isDone(r))g.done++;if(isLate(r))g.late++}
  return [...m.values()].sort((a,b)=>b.n-a.n||a.k.localeCompare(b.k,"vi"));
}

/* ================= PHÂN QUYỀN ================= */
function inScope(u,r){
  if(!u)return false;if(u.role==="admin")return true;
  const sc=fold(u.scope||"");if(!sc)return false;
  if(u.role==="doi_truong")return fold(r.doi_truong).includes(sc);
  if(u.role==="nha_thau")return (fold(r.nt_lap)+" | "+fold(r.nt_vc)).includes(sc);
  return false;
}
function editable(u){return !u?[]:u.role==="admin"?F.filter(f=>f[2]!=="calc").map(f=>f[0]).concat(["anh","_pending"]):u.role==="doi_truong"?DT_FIELDS:u.role==="nha_thau"?NT_FIELDS:[]}
const canEdit=(u,r,k)=>inScope(u,r)&&editable(u).includes(k);
const canEditAny=(u,r)=>inScope(u,r)&&editable(u).length>0;

/* ================= IndexedDB (chế độ thử) ================= */
const idb={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const q=indexedDB.open("wcm-tumat",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};

/* ================= BACKEND: CHẾ ĐỘ THỬ ================= */
const LocalBackend={
  demo:true,_stores:[],_audit:[],_users:[],_urls:{},
  async init(){
    try{this._stores=(await idb.get("stores"))||[];this._audit=(await idb.get("audit"))||[];this._users=(await idb.get("users"))||[]}
    catch(e){this.noIdb=true}
    if(!this._users.length){this._users=[{id:"u-admin",email:"admin@demo",full_name:"Trưởng phòng KT (demo)",role:"admin",scope:""}];await this._save()}
    const id=lsGet("wcm-demo-user",null);this.user=this._users.find(u=>u.id===id)||null;
  },
  async _save(){if(this.noIdb)return;await idb.set("stores",this._stores);await idb.set("audit",this._audit);await idb.set("users",this._users)},
  async login(id){this.user=this._users.find(u=>u.id===id)||null;lsSet("wcm-demo-user",this.user?.id||null)},
  async logout(){this.user=null;lsSet("wcm-demo-user",null)},
  async listStores(){return structuredClone(this._stores)},
  _log(site,action,changes){this._audit.push({site,at:new Date().toISOString(),user_email:this.user?.full_name||this.user?.email,action,changes})},
  async patch(site,p){
    const r=this._stores.find(s=>s.site===site);if(!r)throw new Error("Không thấy cửa hàng "+site);
    if(this.user.role!=="admin"){if(!inScope(this.user,r))throw new Error("Cửa hàng ngoài phạm vi của bạn");const ok=editable(this.user);for(const k in p)if(!ok.includes(k))throw new Error("Không có quyền sửa trường "+k)}
    const ch={};for(const k in p)if(JSON.stringify(r[k]??null)!==JSON.stringify(p[k]??null))ch[k]={old:r[k]??null,new:p[k]??null};
    if(!Object.keys(ch).length)return r;
    Object.assign(r,p);r.ngay_cn=todayISO();this._log(site,"Cập nhật",ch);await this._save();return structuredClone(r);
  },
  async importRows(rows){
    if(this.user.role!=="admin")throw new Error("Chỉ Admin được import");
    for(const x of rows){

      const r=this._stores.find(s=>s.site===x.site);
      if(r){const ch={};for(const k in clean)if(JSON.stringify(r[k]??null)!==JSON.stringify(clean[k]))ch[k]={old:r[k]??null,new:clean[k]};if(Object.keys(ch).length){Object.assign(r,clean);r.ngay_cn=todayISO();this._log(x.site,"Import Excel",ch)}}
      else{this._stores.push({...clean,ngay_cn:todayISO()});this._log(x.site,"Import Excel",null)}
    }

  onChange(){}

/* ================= IMPORT EXCEL ================= */
function headerKey(h){
  const n=norm(h);if(!n)return null;
  for(const f of F)if(norm(f[1])===n)return f[0];
  const alias={"tỉnh/tp cũ":"tinh_cu","quận/huyện cũ":"huyen_cu","serial":"serial_goc","đơn giá tài sản":"dg_ts","đơn giá v/c":"dg_vc","đơn giá lắp đặt":"dg_lap","link ảnh":"link","stt":"stt"};
  for(const a in alias)if(n.startsWith(a))return alias[a];
  return null;
}
function parseDate(v,isMonth){
  if(v===null||v===undefined||v==="")return {iso:null};
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);if(!d||!d.y)return {error:"Ngày không hợp lệ: "+v};
    const iso=ymd(d.y,d.m,d.d);if(!isMonth&&d.d<=12&&d.d!==d.m)return {iso,alt:ymd(d.y,d.d,d.m),amb:true};return {iso}}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return {iso:ymd(+m[1],+m[2],+m[3])};
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    if(b>12&&a<=12)return {iso:ymd(y,a,b),amb:true,note:"Ngày dạng tháng/ngày"};
    if(a>31||b>12)return {error:"Ngày không hợp lệ: "+s};return {iso:ymd(y,b,a)}}
  if(isMonth&&(m=s.match(/^(\d{1,2})[\/.\-](\d{4})$/)))return {iso:ymd(+m[2],+m[1],1)};
  return {error:"Không đọc được ngày: "+s};
}
function parseNum(v){if(v===null||v===undefined||v==="")return {v:null};if(typeof v==="number")return {v};const n=Number(String(v).replace(/[.,\s](?=\d{3}\b)/g,"").replace(/[^\d.\-]/g,""));return isNaN(n)?{error:true}:{v:n}}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const name=wb.SheetNames.find(n=>norm(n)==="tổng hợp");
  const res={sheet:name||wb.SheetNames[0],rows:[],errors:[],warnings:[],pending:[],missingCols:[]};
  if(!name)res.warnings.push({row:"-",msg:`Không thấy sheet "Tổng hợp", đọc sheet "${res.sheet}"`});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[res.sheet],{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(r=>r&&r.some(c=>norm(c)==="site"));
  if(hi<0){res.errors.push({row:"-",msg:"Không tìm thấy dòng tiêu đề có cột Site"});return res}
  const cols=aoa[hi].map(headerKey);
  for(const f of F)if(f[2]!=="calc"&&f[0]!=="ngay_cn"&&!cols.includes(f[0]))res.missingCols.push(f[1]);
  const seen=new Set();
  for(let i=hi+1;i<aoa.length;i++){
    const raw=aoa[i];if(!raw||raw.every(c=>c===null||String(c).trim()===""))continue;
    const rn=i+1,o={},rowErr=[];
    cols.forEach((k,j)=>{if(k)o[k]=raw[j]});
    if(norm(o.stt).startsWith("tổng"))continue;
    const site=String(o.site??"").trim().toUpperCase();
    if(!site){if(o.ten_ch)res.errors.push({row:rn,msg:"Thiếu mã Site — bỏ qua dòng"});continue}
    if(seen.has(site)){res.errors.push({row:rn,site,msg:"Trùng mã Site — bỏ qua dòng"});continue}
    seen.add(site);
    const rec={site,_pending:{}};
    for(const f of F){const [k,,t]=f;if(k==="site"||t==="calc")continue;let v=o[k];if(v===undefined)continue;
      if(t==="date"||t==="month"){const d=parseDate(v,t==="month");if(d.error){rowErr.push(`${f[1]}: ${d.error}`);rec[k]=null}else{rec[k]=d.iso;if(d.amb){rec._pending[k]={orig:d.iso,alt:d.alt||null,note:d.note||""};res.pending.push({row:rn,site,field:f[1],value:fd(d.iso),alt:d.alt?fd(d.alt):""})}}}
      else if(t==="num"||t==="money"){const n=parseNum(v);if(n.error){rowErr.push(`${f[1]}: không phải số (“${v}”)`);rec[k]=null}else rec[k]=n.v}
      else if(t==="status"){const s=STATUSES.find(x=>norm(x)===norm(v));if(v&&!s)rowErr.push(`Trạng thái không hợp lệ: “${v}” → đặt “Chưa cập nhật”`);rec[k]=s||"Chưa cập nhật"}
      else rec[k]=v===null?null:String(v).trim().replace(/\s+/g," ");
    }
    if(!Object.keys(rec._pending).length)delete rec._pending;
    if(rec.sdt_cht&&/^\d{9}$/.test(rec.sdt_cht))rec.sdt_cht="0"+rec.sdt_cht;
    if(rec.vc_dk&&rec.lap_dk&&rec.lap_dk<rec.vc_dk)rowErr.push("Ngày lắp DK trước ngày VC DK (giữ nguyên, cần xác nhận)");
    rowErr.forEach(m=>res.warnings.push({row:rn,site,msg:m}));
    res.rows.push(rec);
  }
  return res;
}

/* ================= EXPORT EXCEL ================= */
function exportExcel(rows,name){
  const head=F.map(f=>f[1]);
  const aoa=[head];
  const toD=iso=>{if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
  for(const r of rows)aoa.push(F.map(([k,,t])=>k==="tong"?total(r):k==="kiem_tra"?flags(r).concat(isLate(r)?["Trễ tiến độ"]:[]).join("; "):(t==="date"||t==="month")?toD(r[k]):(r[k]??null)));
  const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true,dateNF:"dd/mm/yyyy"});
  ws["!cols"]=F.map(f=>({wch:Math.min(Math.max(f[1].length,10),28)}));
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:F.length-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Tổng hợp");
  XLSX.writeFile(wb,name||`Thay_tu_mat_WCM_${todayISO()}.xlsx`);
}

/* ================= NÉN ẢNH ================= */
async function compressImage(file,max=1600,q=.72){
  let src;try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
}

/* ---------- Danh sách ---------- */
function applyFilters(rows,f){
  const q=fold(f.q);
  let r=rows.filter(x=>{
    if(q&&!(fold(x.site).includes(q)||fold(x.ten_ch).includes(q)))return false;
    if(f.tinh&&(x.tinh||"")!==f.tinh)return false;
    if(f.st&&(x.trang_thai||"Chưa cập nhật")!==f.st)return false;
    if(f.dt){if(f.dt==="__none"?x.doi_truong:(x.doi_truong||"")!==f.dt)return false}
    if(f.pt){if(f.pt==="__none"?x.phu_trach:(x.phu_trach||"")!==f.pt)return false}
    if(f.nt&&x.nt_lap!==f.nt&&x.nt_vc!==f.nt)return false;
    if(f.flag==="flag"&&!flags(x).length)return false;
    if(f.flag==="late"&&!isLate(x))return false;
    if(f.flag==="pending"&&!(x._pending&&Object.keys(x._pending).length))return false;
    if(f.flag==="done"&&!isDone(x))return false;
    if(f.flag==="todo"&&isDone(x))return false;
    if(f.flag==="mine"&&!inScope(B.user,x))return false;
    return true});
  const [k,dir]=(f.sort||"lap_dk").split(":");
  r.sort((a,b)=>{if(k==="stt")return (a.stt||0)-(b.stt||0);const A=a[k]||"9999",Bv=b[k]||"9999";return (dir==="desc"?-1:1)*A.localeCompare(Bv)||(a.stt||0)-(b.stt||0)});
  return r;
}
function viewList(params){
  const f=S.filters;

  const rows=visible();

  const nts=[...new Set(rows.flatMap(r=>[r.nt_lap,r.nt_vc]).filter(Boolean))].sort();
  const opt=(arr,v,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option ${x===v?"selected":""} value="${esc(x)}">${esc(x)}</option>`).join("");
  const scoped=B.user.role==="doi_truong"||B.user.role==="nha_thau";
  render(shell("#/list",`<h2>Danh sách cửa hàng</h2>
  <div class="filters">
    <input class="full" id="fq" placeholder="Tìm tên cửa hàng hoặc mã Site" value="${esc(f.q)}" type="search">
    <select id="ftinh">${opt(uniq("tinh"),f.tinh,"Tất cả tỉnh")}</select>
    <select id="fst">${opt(STATUSES,f.st,"Tất cả trạng thái")}</select>
    <select id="fdt">${opt(uniq("doi_truong"),f.dt,"Tất cả đội trưởng")}${f.dt==="__none"?'<option value="__none" selected>(Chưa có đội trưởng)</option>':""}</select>
    <select id="fnt">${opt(nts,f.nt,"Tất cả nhà thầu")}</select>
    <select id="fflag"><option value="">Tất cả</option>${[["todo","Chưa hoàn thành"],["done","Đã hoàn thành"],["late","Trễ tiến độ"],["flag","Có cờ lỗi"],["pending","Chờ xác nhận ngày"]].concat(scoped?[["mine","Thuộc phạm vi tôi"]]:[]).map(([v,l])=>`<option value="${v}" ${f.flag===v?"selected":""}>${l}</option>`).join("")}</select>
    <select id="fsort">${[["lap_dk","Ngày lắp DK ↑"],["lap_dk:desc","Ngày lắp DK ↓"],["vc_dk","Ngày VC DK ↑"],["vc_dk:desc","Ngày VC DK ↓"],["stt","Theo Stt"]].map(([v,l])=>`<option value="${v}" ${f.sort===v?"selected":""}>${l}</option>`).join("")}</select>
  </div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="small muted" id="cnt"></span><span class="row"><button class="btn sm" id="fclr">Xoá lọc</button><button class="btn sm" id="fexp">Xuất Excel</button></span></div>
  <div class="list" id="lst"></div>`));
  const draw=()=>{const r=applyFilters(rows,f);$("#cnt").textContent=`${r.length}/${rows.length} cửa hàng${f.pt?` · Phụ trách: ${f.pt==="__none"?"(chưa có)":f.pt}`:""}`;
    $("#lst").innerHTML=r.map(x=>{const fl=flags(x);return `<a class="item" href="#/store/${encodeURIComponent(x.site)}"><div class="t1"><span class="name">${esc(x.ten_ch||x.site)}</span>${chip(x.trang_thai)}</div>
    <div class="meta"><span><b>${esc(x.site)}</b></span><span>${esc(x.tinh||"")}</span><span>VC DK ${fd(x.vc_dk)||"—"}</span><span>Lắp DK ${fd(x.lap_dk)||"—"}</span>${x.lap_tt?`<span>Lắp TT ${fd(x.lap_tt)}</span>`:""}</div>
    <div class="chips">${isLate(x)?'<span class="chip late">Trễ</span>':""}${fl.length?`<span class="chip flag">${fl.length} cờ lỗi</span>`:""}${x.doi_truong?`<span class="chip">${esc(x.doi_truong)}</span>`:""}</div></a>`}).join("")||'<p class="muted">Không có cửa hàng phù hợp.</p>';};
  const bind=(id,k,ev="change")=>{$(id).addEventListener(ev,e=>{f[k]=e.target.value;lsSet("wcm-filters",f);draw()})};
  bind("#fq","q","input");bind("#ftinh","tinh");bind("#fst","st");bind("#fdt","dt");bind("#fnt","nt");bind("#fflag","flag");bind("#fsort","sort");
  $("#fclr").onclick=()=>{Object.assign(f,{q:"",tinh:"",st:"",dt:"",pt:"",nt:"",flag:""});lsSet("wcm-filters",f);viewList()};
  $("#fexp").onclick=()=>{try{exportExcel(applyFilters(rows,f))}catch(e){toast("Không xuất được: "+e.message)}};
  draw();
}

  const kv=keys=>`<dl class="kv">${keys.map(k=>{const f=FK[k];let v=r[k];if(f[2]==="date")v=fd(v);else if(f[2]==="month")v=fm(v);else if(f[2]==="money")v=v==null?"":money(v)+" đ";else if(f[2]==="tel"&&v)v=`<a href="tel:${esc(String(v).replace(/\s/g,""))}">${esc(v)}</a>`;else if(f[2]==="url"&&v)v=`<a href="${esc(v)}" target="_blank" rel="noopener">Mở link</a>`;else v=esc(v);return `<dt>${esc(f[1])}</dt><dd>${v||'<span class="muted">—</span>'}</dd>`}).join("")}</dl>`;

  const photos=r.anh||[];
  render(shell("#/list",`<p class="small"><a href="javascript:history.back()">← Quay lại</a></p>
  <div class="card"><div class="t1 row" style="justify-content:space-between"><h2 style="margin:0">${esc(r.ten_ch||r.site)}</h2>${chip(r.trang_thai)}</div>
    <div class="small muted" style="margin:4px 0 10px">Site <b>${esc(r.site)}</b> · ${esc(r.tinh||"")} · Cập nhật ${fd(r.ngay_cn)||"—"}</div>
    ${isLate(r)?'<div class="err">Trễ tiến độ: đã qua ngày lắp dự kiến nhưng chưa hoàn thành.</div>':""}
    ${fl.length?`<div class="warnmsg"><b>Kiểm tra dữ liệu:</b><br>${fl.map(esc).join("<br>")}</div>`:""}
    ${canEditAny(u,r)?`<a class="btn pri big" href="#/quick/${encodeURIComponent(r.site)}">Cập nhật nhanh</a>`:""}
  </div>
  <div class="grid2">
    <div class="card"><h3>Mốc tiến độ</h3><ul class="tl">
      <li class="done"><span class="dot"></span><b>Kế hoạch</b><div class="small">Trạng thái: ${esc(r.trang_thai||"Chưa cập nhật")}</div></li>
      ${ms("Vận chuyển đến CH","vc_dk","vc_tt")}${ms("Lắp đặt hoàn thành","lap_dk","lap_tt")}
      <li class="${r.trang_thai==="Đã nghiệm thu"?"done":""}"><span class="dot"></span><b>Nghiệm thu</b><div class="small">${r.trang_thai==="Đã nghiệm thu"?"Đã nghiệm thu":"Chưa"}</div></li></ul></div>
    <div class="card"><h3>Cửa hàng</h3>${kv(["stt","phu_trach","tinh","thang_kt","tinh_cu","huyen_cu","cht","sdt_cht"])}</div>
    <div class="card"><h3>Triển khai</h3>${kv(["hien_trang","doi_truong","ktkv","nt_lap","nt_vc","km"])}</div>
    <div class="card"><h3>Thiết bị</h3>${kv(["ma_ts","ten_vt","article","ncc","model","serial_goc","serial_tt","xuat_xu","dvt","so_luong","dg_ts","dg_vc","dg_lap"])}<dl class="kv" style="margin-top:6px"><dt><b>Tổng</b></dt><dd><b>${money(total(r))} đ</b></dd></dl></div>

  if($("#padd"))$("#padd").onchange=e=>addPhotos(r,[...e.target.files],$("#pmsg")).then(()=>viewStore(site));

  try{const a=await B.audit(site);$("#aud").innerHTML=a.length?a.map(x=>`<div class="audit"><div class="when">${fdt(x.at)} · <b>${esc(x.user_email||"?")}</b> · ${esc(x.action||"")}</div>${x.changes?Object.entries(x.changes).map(([k,v])=>`<div>${esc(FK[k]?.[1]||(k==="anh"?"Ảnh":k==="_pending"?"Xác nhận ngày":k))}: ${fmtVal(k,v.old)} → <b>${fmtVal(k,v.new)}</b></div>`).join(""):""}</div>`).join(""):"Chưa có thay đổi."}catch(e){$("#aud").textContent="Không tải được lịch sử: "+e.message}
}
function fmtVal(k,v){if(v===null||v===undefined||v==="")return '<span class="muted">(trống)</span>';if(k==="anh")return `${v.length} ảnh`;if(k==="_pending")return `${Object.keys(v).length} ngày chờ`;const t=FK[k]?.[2];if(t==="date")return fd(v);if(t==="money")return money(v);return esc(typeof v==="object"?JSON.stringify(v):v)}
async function addPhotos(r,files,msgEl){
  if(!files.length)return;const list=(r.anh||[]).slice();
  for(let i=0;i<files.length;i++){if(msgEl)msgEl.textContent=`Đang nén & tải ảnh ${i+1}/${files.length}…`;
    const blob=await compressImage(files[i]);const path=await B.uploadPhoto(r.site,blob);list.push({path,at:new Date().toISOString(),by:B.user.full_name||B.user.email,kb:Math.round(blob.size/1024)})}
  await save(r.site,{anh:list});if(msgEl)msgEl.textContent="";toast(`Đã thêm ${files.length} ảnh`);
}
async function save(site,patch){
  const r=await B.patch(site,patch);const i=S.stores.findIndex(x=>x.site===site);if(i>=0)S.stores[i]={...S.stores[i],...patch,...r};return r;
}
function inputFor(k,v){const [,lbl,t]=FK[k];
  if(t==="status")return `<label class="f">${lbl}<select data-k="${k}">${STATUSES.map(s=>`<option ${s===(v||"Chưa cập nhật")?"selected":""}>${s}</option>`).join("")}</select></label>`;
  if(t==="textarea")return `<label class="f">${lbl}<textarea data-k="${k}">${esc(v)}</textarea></label>`;
  const type=t==="date"?"date":t==="month"?"month":(t==="num"||t==="money")?"number":t==="tel"?"tel":t==="url"?"url":"text";
  const val=t==="month"&&v?String(v).slice(0,7):v;
  return `<label class="f">${lbl}<input data-k="${k}" type="${type}" ${type==="number"?'inputmode="decimal"':""} value="${esc(val)}"></label>`;
}
function readInputs(box){const p={};box.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k,t=FK[k][2];let v=el.value.trim();if(v==="")v=null;else if(t==="num"||t==="money")v=Number(v);else if(t==="month")v=v+"-01";p[k]=v});return p}
function editForm(r){
  const ok=editable(B.user).filter(k=>FK[k]&&FK[k][2]!=="calc"&&k!=="ngay_cn"&&k!=="site");
  const box=$("#editbox");
  box.innerHTML=`<div id="eerr"></div>${ok.map(k=>inputFor(k,r[k])).join("")}<div class="row"><button class="btn pri" id="esave">Lưu thay đổi</button><button class="btn" id="ecancel">Huỷ</button></div>`;
  $("#ecancel").onclick=()=>viewStore(r.site);
  $("#esave").onclick=async()=>{const p=readInputs(box),diff={};for(const k in p)if((p[k]??null)!==(r[k]??null))diff[k]=p[k];
    for(const k of DATE_KEYS)if(k in diff&&r._pending?.[k]){const pd={...r._pending};delete pd[k];diff._pending=pd}
    if(!Object.keys(diff).length){toast("Không có thay đổi");return}
    try{await save(r.site,diff);toast("Đã lưu");viewStore(r.site)}catch(e){$("#eerr").innerHTML=`<div class="err">${esc(e.message)}</div>`}};
}

  if($("#qcam")){$("#qcam").onchange=onFiles;$("#qlib").onchange=onFiles}

  <p class="small muted">Các ngày trong file Excel là kiểu ngày có số ngày ≤ 12, có thể bị đảo ngày/tháng. App <b>không tự sửa</b>; chọn cách đọc đúng cho từng ngày.</p>
  ${items.length?`<div class="card"><h3>Xác nhận hàng loạt</h3><div class="row"><button class="btn" id="allKeep">Tất cả: giữ như file</button><button class="btn" id="allSwap">Tất cả: đảo ngày/tháng</button></div></div>`:'<div class="okmsg">Không còn ngày nào cần xác nhận.</div>'}
  <div id="pl">${items.map((x,i)=>`<div class="pend"><div class="row" style="justify-content:space-between"><b><a href="#/store/${encodeURIComponent(x.r.site)}">${esc(x.r.site)}</a> · ${esc(FK[x.k][1])}</b><span class="small muted">${esc(x.r.tinh||"")}</span></div>
    ${x.p.note?`<div class="small muted">${esc(x.p.note)}</div>`:""}
    <div class="opts"><button class="btn" data-i="${i}" data-v="orig">${fd(x.p.orig)}<br><span class="small muted">giữ như file</span></button>${x.p.alt?`<button class="btn" data-i="${i}" data-v="alt">${fd(x.p.alt)}<br><span class="small muted">đảo ngày/tháng</span></button>`:""}</div></div>`).join("")}</div>`));
  const apply=async(list,which)=>{
    const by=new Map();for(const x of list){if(!by.has(x.r.site))by.set(x.r.site,{r:x.r,ks:[]});by.get(x.r.site).ks.push(x.k)}
    let n=0;try{for(const {r,ks} of by.values()){const pd={...(r._pending||{})},p={};for(const k of ks){const v=which==="alt"&&pd[k].alt?pd[k].alt:pd[k].orig;if(v!==r[k])p[k]=v;delete pd[k]}p._pending=Object.keys(pd).length?pd:null;await save(r.site,p);n+=ks.length}toast(`Đã xác nhận ${n} ngày`)}catch(e){toast("Lỗi: "+e.message,5000)}
    viewConfirm();
  };
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>apply([items[+b.dataset.i]],b.dataset.v));
  if($("#allKeep")){$("#allKeep").onclick=()=>{if(confirm(`Giữ nguyên ${items.length} ngày như trong file?`))apply(items,"orig")};$("#allSwap").onclick=()=>{if(confirm(`Đảo ngày/tháng cho ${items.length} ngày?`))apply(items,"alt")}}
}

/* ---------- Thêm ---------- */
function viewMore(){
  const u=B.user;
  render(shell("#/more",`<h2>Thêm</h2>
  <div class="card"><b>${esc(u.full_name||u.email)}</b><div class="small muted">${esc(ROLES[u.role])}${u.scope?` · Phạm vi: ${esc(u.scope)}`:""}</div></div>
  ${u.role==="admin"?`<a class="btn big" style="margin-bottom:8px" href="#/import">Import Excel</a><a class="btn big" style="margin-bottom:8px" href="#/users">Quản lý người dùng</a>`:""}
  <button class="btn big" style="margin-bottom:8px" id="expAll">Xuất Excel toàn bộ</button>
  <button class="btn big" style="margin-bottom:8px" id="theme">Đổi giao diện sáng/tối</button>
  <button class="btn big danger" id="lo">Đăng xuất</button>
  <p class="small muted" style="margin-top:16px">Thiết bị: Tủ mát không cánh dàn nóng ngoài Carrier Mendos EU D 188A · 1 tủ/CH.<br>Mở trên điện thoại: menu trình duyệt → “Thêm vào màn hình chính” để dùng như app.</p>`));
  $("#expAll").onclick=()=>{try{exportExcel(applyFilters(S.stores,{sort:"stt"}))}catch(e){toast(e.message)}};
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;lsSet("wcm-theme",n)};
  $("#lo").onclick=async()=>{await B.logout();App.reload()};
}

/* ---------- Import ---------- */
function viewImport(){
  if(B.user.role!=="admin"){location.hash="#/";return}
  const pv=S.importPreview;
  render(shell("#/more",`<h2>Import Excel</h2>
  <div class="card"><p class="small muted">Đọc sheet <b>“Tổng hợp”</b>, khớp theo cột <b>Site</b>. Ô trống trong file không xoá dữ liệu đã nhập trên app. Ngày nghi đảo ngày/tháng được giữ nguyên và đưa vào danh sách <a href="#/confirm">cần xác nhận</a>.</p>
  <label class="btn pri big">Chọn file .xlsx<input type="file" accept=".xlsx,.xls" class="hide" id="ifile"></label></div>
  <div id="ipv">${pv?previewHtml(pv):""}</div>`));
  $("#ifile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.importPreview=parseWorkbook(await f.arrayBuffer());S.importPreview.file=f.name}catch(err){S.importPreview={errors:[{row:"-",msg:"Không đọc được file: "+err.message}],rows:[],warnings:[],pending:[],missingCols:[]}}viewImport()};
  if($("#igo"))$("#igo").onclick=async()=>{const b=$("#igo");b.disabled=true;b.textContent="Đang nhập…";try{const n=await B.importRows(pv.rows);S.importPreview=null;await App.load();toast(`Đã nhập ${n} cửa hàng`);location.hash=pv.pending.length?"#/confirm":"#/"}catch(e){b.disabled=false;b.textContent="Nhập dữ liệu";$("#ires").innerHTML=`<div class="err">${esc(e.message)}</div>`}};
  if($("#icancel"))$("#icancel").onclick=()=>{S.importPreview=null;viewImport()};
}
function previewHtml(pv){
  const exist=new Set(S.stores.map(s=>s.site));const nNew=pv.rows.filter(r=>!exist.has(r.site)).length;
  const tbl=(arr,cols)=>`<div class="scroll-x"><table class="t"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${arr.map(x=>`<tr>${cols.map(c=>`<td>${esc(x[c[1]]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<div class="card"><h3>Kết quả đọc file ${esc(pv.file||"")}</h3>
  <div class="${pv.rows.length?"okmsg":"err"}">${pv.rows.length} dòng hợp lệ (${nNew} mới, ${pv.rows.length-nNew} cập nhật) · sheet “${esc(pv.sheet||"")}”</div>
  ${pv.missingCols.length?`<div class="warnmsg">Thiếu cột: ${pv.missingCols.map(esc).join(", ")}</div>`:""}
  ${pv.errors.length?`<h3 style="color:var(--bad)">Lỗi — dòng bị bỏ qua (${pv.errors.length})</h3>${tbl(pv.errors,[["Dòng","row"],["Site","site"],["Lỗi","msg"]])}`:""}
  ${pv.warnings.length?`<h3 style="color:var(--warn);margin-top:12px">Cảnh báo — vẫn nhập (${pv.warnings.length})</h3>${tbl(pv.warnings,[["Dòng","row"],["Site","site"],["Nội dung","msg"]])}`:""}
  ${pv.pending.length?`<h3 style="margin-top:12px">Ngày cần xác nhận (${pv.pending.length})</h3><p class="small muted">Giữ nguyên giá trị như file; xác nhận sau khi nhập.</p>${tbl(pv.pending.slice(0,200),[["Dòng","row"],["Site","site"],["Cột","field"],["Như file","value"],["Nếu đảo","alt"]])}`:""}
  <div id="ires"></div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="igo" ${pv.rows.length?"":"disabled"}>Nhập dữ liệu</button><button class="btn" id="icancel">Huỷ</button></div></div>`;
}

/* ---------- Người dùng ---------- */
async function viewUsers(){
  if(B.user.role!=="admin"){location.hash="#/";return}
  let users=[];try{users=await B.listUsers()}catch(e){render(shell("#/more",`<div class="err">${esc(e.message)}</div>`));return}
  const dts=[...new Set(S.stores.map(r=>r.doi_truong).filter(Boolean))],nts=[...new Set(S.stores.flatMap(r=>[r.nt_lap,r.nt_vc]).filter(Boolean))];
  const card=u=>`<div class="card" data-id="${esc(u.id)}"><div class="row" style="justify-content:space-between"><b>${esc(u.full_name||u.email||"(mới)")}</b><span class="small muted">${esc(u.email||"")}</span></div>
    <label class="f">Họ tên<input data-f="full_name" value="${esc(u.full_name||"")}"></label>
    ${B.demo&&!u.id?`<label class="f">Email / tên đăng nhập<input data-f="email"></label>`:""}
    <label class="f">Vai trò<select data-f="role">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">Phạm vi (Đội trưởng: tên/SĐT như cột “Đội trưởng KTKV”; Nhà thầu: tên như cột Nhà thầu)<input data-f="scope" list="scopes" value="${esc(u.scope||"")}"></label>
    <div class="row"><button class="btn pri sm" data-save>Lưu</button>${u.id&&u.id!==B.user.id?`<button class="btn sm danger" data-del>${B.demo?"Xoá":"Thu hồi quyền"}</button>`:""}<span class="small muted" data-cnt></span></div></div>`;
  render(shell("#/more",`<h2>Người dùng & phân quyền</h2>
  ${B.demo?"":'<p class="small muted">Người dùng tự đăng ký bằng email trên màn hình đăng nhập, sau đó Admin cấp vai trò và phạm vi tại đây.</p>'}
  <datalist id="scopes">${dts.concat(nts).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
  <div id="ul">${users.map(card).join("")}</div>
  ${B.demo?`<button class="btn big" id="uadd">+ Thêm người dùng</button>`:""}`));
  const cnt=el=>{const u={role:el.querySelector('[data-f=role]').value,scope:el.querySelector('[data-f=scope]').value};const c=el.querySelector("[data-cnt]");if(c)c.textContent=["doi_truong","nha_thau"].includes(u.role)?`Phạm vi khớp ${S.stores.filter(r=>inScope(u,r)).length} CH`:""};
  const wire=el=>{
    el.querySelectorAll("[data-f]").forEach(i=>i.addEventListener("input",()=>cnt(el)));cnt(el);
    el.querySelector("[data-save]").onclick=async()=>{const u={id:el.dataset.id||undefined};el.querySelectorAll("[data-f]").forEach(i=>u[i.dataset.f]=i.value.trim());
      if(["doi_truong","nha_thau"].includes(u.role)&&!u.scope){toast("Cần nhập phạm vi cho vai trò này");return}
      try{await B.saveUser(u);toast("Đã lưu");viewUsers()}catch(e){toast("Lỗi: "+e.message,5000)}};
    const d=el.querySelector("[data-del]");if(d)d.onclick=async()=>{if(!confirm("Chắc chắn?"))return;try{await B.deleteUser(el.dataset.id);viewUsers()}catch(e){toast(e.message)}};
  };
  document.querySelectorAll("#ul .card").forEach(wire);
  if($("#uadd"))$("#uadd").onclick=()=>{const w=document.createElement("div");w.innerHTML=card({id:"",role:"viewer"});const el=w.firstElementChild;el.dataset.id="";$("#ul").appendChild(el);wire(el);el.scrollIntoView()};
}

/* ================= ĐIỀU HƯỚNG ================= */
const App={
  async load(){S.stores=await B.listStores();S.loaded=true},
  async reload(){try{if(B.user&&B.user.role!=="pending")await this.load()}catch(e){render(`<main><div class="err">Lỗi tải dữ liệu: ${esc(e.message)}</div><button class="btn" onclick="location.reload()">Thử lại</button></main>`);return}this.route()},
  route(){
    if(!B.user)return viewLogin();
    if(B.user.role==="pending")return viewPending();
    const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const parts=path.split("/").filter(Boolean);
    window.scrollTo(0,0);
    switch(parts[0]){
      case undefined:return viewDash();
      case "list":return viewList(new URLSearchParams(qs||""));
      case "store":return viewStore(decodeURIComponent(parts[1]||""));
      case "quick":return viewQuick(decodeURIComponent(parts[1]||""));
      case "confirm":return viewConfirm();
      case "import":return viewImport();
      case "users":return viewUsers();
      case "more":return viewMore();
      default:return viewDash();
    }
  }
};
(async()=>{
  const th=lsGet("wcm-theme",null);if(th)document.documentElement.dataset.theme=th;
  try{await B.init()}catch(e){render(`<main><div class="err">${esc(e.message)}</div></main>`);return}
  addEventListener("hashchange",()=>App.route());
  let tmr;B.onChange(()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{const h=location.hash;if(/^#\/(quick|import|users)/.test(h)||document.querySelector("#editbox textarea,#editbox input"))return;await App.load();App.route()},600)});
  await App.reload();
  if("serviceWorker" in navigator&&location.protocol==="https:"&&window.top===window)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
